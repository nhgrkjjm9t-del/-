<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام إدارة الصاج | Mohy Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Import Maps for React & Firebase -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.292.0",
          "firebase/app": "https://esm.sh/firebase@10.8.0/app",
          "firebase/auth": "https://esm.sh/firebase@10.8.0/auth",
          "firebase/firestore": "https://esm.sh/firebase@10.8.0/firestore"
        }
      }
    </script>
    
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Custom CSS for Printing -->
    <style>
        @media print {
            body { background-color: white !important; }
            .print\:hidden { display: none !important; }
            .print\:block { display: block !important; }
            .print\:bg-transparent { background-color: transparent !important; }
            .print\:border-black { border-color: black !important; }
            .print\:shadow-none { box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-gray-50 text-right font-sans">
    
    <div id="root">
        <!-- Loading Screen before React starts -->
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #0a0a0a; color: #D4AF37;">
            <div style="width: 60px; height: 60px; border: 3px solid #D4AF37; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                <span style="font-family: serif; font-size: 30px;">M</span>
            </div>
            <p style="font-family: sans-serif; font-weight: bold; letter-spacing: 2px;">جاري تحميل النظام...</p>
        </div>
    </div>

    <!-- The React App Code -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { LayoutDashboard, Package, ShoppingCart, PlusCircle, Trash2, FileText, CheckCircle, Wallet, Receipt, Users, LogIn, Lock, User, ShieldAlert, Loader2, CalendarDays, Settings, ChevronRight, AlertTriangle, Printer, MessageCircle, Phone, X } from 'lucide-react';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot } from 'firebase/firestore';

        // --- Firebase Configuration ---
        const firebaseConfig = {
          apiKey: "AIzaSyAKy58WcOQMAn0Na-Ruo9heUl7HiFZAnPM",
          authDomain: "tiktokshop-9fd63.firebaseapp.com",
          databaseURL: "https://tiktokshop-9fd63-default-rtdb.firebaseio.com",
          projectId: "tiktokshop-9fd63",
          storageBucket: "tiktokshop-9fd63.firebasestorage.app",
          messagingSenderId: "1008538085856",
          appId: "1:1008538085856:web:435671cbab4d241a2c2385"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const getPath = (colName) => collection(db, 'artifacts', 'tiktokshop-9fd63', 'public', 'data', colName);

        function App() {
          const [fbUser, setFbUser] = useState(null);
          const [dbLoading, setDbLoading] = useState(true);
          const [dbError, setDbError] = useState(null);

          const [currentUser, setCurrentUser] = useState(null);
          const [loginForm, setLoginForm] = useState({ username: '', password: '' });
          const [loginError, setLoginError] = useState('');

          const [users, setUsers] = useState([]);
          const [inventory, setInventory] = useState([]);
          const [expenses, setExpenses] = useState([]);
          const [sales, setSales] = useState([]);

          const [activeTab, setActiveTab] = useState('dashboard');
          const [newItem, setNewItem] = useState({ name: '', thickness: '', size: '', qty: '', price: '' });
          const [newExpense, setNewExpense] = useState({ desc: '', amount: '' });
          const [newUser, setNewUser] = useState({ username: '', password: '', role: 'employee', permissions: { pos: true, inventory: false, expenses: false, reports: false } });
          
          const [cart, setCart] = useState([]);
          const [customerName, setCustomerName] = useState('');
          const [customerPhone, setCustomerPhone] = useState('');
          const [lastInvoice, setLastInvoice] = useState(null);
          const [posError, setPosError] = useState('');

          const [reportPeriod, setReportPeriod] = useState('month'); 
          const [reportDate, setReportDate] = useState(new Date().toISOString().substring(0, 10));

          useEffect(() => {
            const initAuth = async () => {
              try { await signInAnonymously(auth); } 
              catch (err) { setDbError("تأكد من تفعيل (Anonymous) في فايربيز."); setDbLoading(false); }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (user) => {
              if (user) { setFbUser(user); setDbError(null); }
            });
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!fbUser) return;
            try {
              const unsubInventory = onSnapshot(getPath('inventory'), (snap) => setInventory(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
              const unsubExpenses = onSnapshot(getPath('expenses'), (snap) => setExpenses(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.timestamp - a.timestamp)));
              const unsubSales = onSnapshot(getPath('sales'), (snap) => setSales(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.timestamp - a.timestamp)));
              const unsubUsers = onSnapshot(getPath('users'), (snap) => {
                const fetchedUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (fetchedUsers.length === 0) {
                  addDoc(getPath('users'), { username: 'mohamed nabil', password: '00000', role: 'admin', permissions: ['dashboard', 'inventory', 'pos', 'expenses', 'reports'] });
                } else { setUsers(fetchedUsers); }
                setDbLoading(false);
              });
              return () => { unsubInventory(); unsubExpenses(); unsubSales(); unsubUsers(); };
            } catch (err) { setDbError("حدث خطأ أثناء جلب البيانات."); setDbLoading(false); }
          }, [fbUser]);

          const handleLogin = (e) => {
            e.preventDefault();
            const user = users.find(u => u.username === loginForm.username && u.password === loginForm.password);
            if (user) {
              setCurrentUser(user);
              setLoginError('');
              if (user.role === 'admin' || (user.permissions || []).includes('dashboard')) setActiveTab('dashboard');
              else if ((user.permissions || []).includes('pos')) setActiveTab('pos');
              else if ((user.permissions || []).includes('inventory')) setActiveTab('inventory');
            } else { setLoginError('اسم المستخدم أو كلمة المرور غير صحيحة'); }
          };
          const handleLogout = () => { setCurrentUser(null); setLoginForm({ username: '', password: '' }); };

          const handleAddItem = async (e) => {
            e.preventDefault();
            if (!newItem.name || !newItem.qty) return;
            await addDoc(getPath('inventory'), { name: newItem.name, thickness: parseFloat(newItem.thickness) || 0, size: newItem.size, qty: parseInt(newItem.qty) || 0, price: parseFloat(newItem.price) || 0 });
            setNewItem({ name: '', thickness: '', size: '', qty: '', price: '' });
          };
          const handleDeleteItem = async (id) => await deleteDoc(doc(db, 'artifacts', 'tiktokshop-9fd63', 'public', 'data', 'inventory', id));
          
          const handleAddExpense = async (e) => {
            e.preventDefault();
            if (!newExpense.desc || !newExpense.amount) return;
            await addDoc(getPath('expenses'), { desc: newExpense.desc, amount: parseFloat(newExpense.amount) || 0, date: new Date().toLocaleDateString('ar-EG'), timestamp: Date.now() });
            setNewExpense({ desc: '', amount: '' });
          };
          const handleDeleteExpense = async (id) => await deleteDoc(doc(db, 'artifacts', 'tiktokshop-9fd63', 'public', 'data', 'expenses', id));

          const handleAddUser = async (e) => {
            e.preventDefault();
            if (!newUser.username || !newUser.password) return;
            let perms = [];
            if (newUser.permissions.pos) perms.push('pos');
            if (newUser.permissions.inventory) perms.push('inventory');
            if (newUser.permissions.expenses) perms.push('expenses');
            if (newUser.permissions.reports) perms.push('reports');
            await addDoc(getPath('users'), { username: newUser.username, password: newUser.password, role: newUser.role, permissions: perms });
            setNewUser({ username: '', password: '', role: 'employee', permissions: { pos: true, inventory: false, expenses: false, reports: false } });
          };
          const handleDeleteUser = async (id) => await deleteDoc(doc(db, 'artifacts', 'tiktokshop-9fd63', 'public', 'data', 'users', id));

          const handleAddToCart = (item) => {
            if (!item) return;
            const existing = cart.find(c => c.item.id === item.id);
            if (existing) {
              if (existing.qty < item.qty) {
                setCart(cart.map(c => c.item.id === item.id ? { ...c, qty: c.qty + 1 } : c));
                setPosError('');
              } else {
                setPosError(`الكمية المطلوبة من (${item.name}) غير متوفرة!`);
                setTimeout(() => setPosError(''), 3000); 
              }
            } else { setCart([...cart, { item, qty: 1 }]); setPosError(''); }
          };
          const handleRemoveFromCart = (id) => setCart(cart.filter(c => c.item.id !== id));
          const cartTotal = cart.reduce((total, c) => total + ((c.item?.price || 0) * (c.qty || 0)), 0);

          const handleCheckout = async () => {
            if (cart.length === 0) return;
            for (const cartItem of cart) {
              if (!cartItem.item || !cartItem.item.id) continue;
              const invDocRef = doc(db, 'artifacts', 'tiktokshop-9fd63', 'public', 'data', 'inventory', cartItem.item.id);
              const newQty = Math.max(0, (cartItem.item.qty || 0) - (cartItem.qty || 0));
              await updateDoc(invDocRef, { qty: newQty });
            }
            const invoiceData = {
              invoiceNumber: Math.floor(100000 + Math.random() * 900000),
              customerName: customerName || 'عميل نقدي',
              customerPhone: customerPhone || 'غير مسجل',
              total: cartTotal || 0,
              date: new Date().toLocaleDateString('ar-EG'),
              time: new Date().toLocaleTimeString('ar-EG'),
              seller: currentUser?.username || 'بائع',
              items: cart.map(c => ({ name: c.item?.name || 'صنف', qty: c.qty || 0, price: c.item?.price || 0, total: (c.qty || 0) * (c.item?.price || 0) })),
              timestamp: Date.now()
            };
            await addDoc(getPath('sales'), invoiceData);
            setLastInvoice(invoiceData); setCart([]); setCustomerName(''); setCustomerPhone('');
          };

          const sendWhatsApp = () => {
            if (!lastInvoice) return;
            let text = `*مرحباً بك في شركة إدارة الصاج*\n\n📄 *رقم الفاتورة:* ${lastInvoice.invoiceNumber}\n👤 *العميل:* ${lastInvoice.customerName}\n📅 *التاريخ:* ${lastInvoice.date}\n------------------------\n`;
            lastInvoice.items.forEach(item => { text += `▪️ ${item.name} | العدد: ${item.qty} | السعر: ${item.price} ج.م\n`; });
            text += `------------------------\n💰 *الإجمالي الكلي:* ${lastInvoice.total} ج.م\n\nشكراً لتعاملك معنا! ✨`;
            const phoneParam = lastInvoice.customerPhone !== 'غير مسجل' ? `2${lastInvoice.customerPhone}` : '';
            window.open(`https://wa.me/${phoneParam}?text=${encodeURIComponent(text)}`, '_blank');
          };

          const hasPerm = (perm) => currentUser?.role === 'admin' || (currentUser?.permissions || []).includes(perm);

          const filterDataByDate = (dataArray) => {
            return dataArray.filter(item => {
              if (reportPeriod === 'all') return true;
              if (!item.timestamp) return false;
              const itemDate = new Date(item.timestamp);
              const targetDate = new Date(reportDate);
              if (reportPeriod === 'year') return itemDate.getFullYear() === targetDate.getFullYear();
              if (reportPeriod === 'month') return itemDate.getFullYear() === targetDate.getFullYear() && itemDate.getMonth() === targetDate.getMonth();
              if (reportPeriod === 'day') return itemDate.getFullYear() === targetDate.getFullYear() && itemDate.getMonth() === targetDate.getMonth() && itemDate.getDate() === targetDate.getDate();
              return true;
            });
          };

          const filteredSales = filterDataByDate(sales);
          const filteredExpenses = filterDataByDate(expenses);
          const totalSales = filteredSales.reduce((sum, sale) => sum + (sale.total || 0), 0);
          const totalExpenses = filteredExpenses.reduce((sum, exp) => sum + (exp.amount || 0), 0);
          const netIncome = totalSales - totalExpenses;
          const inventoryValue = inventory.reduce((sum, item) => sum + ((item.price || 0) * (item.qty || 0)), 0);

          const MohyLogo = ({ className = "" }) => (
            <div className={`flex flex-col justify-center items-center select-none pointer-events-none ${className}`}>
              <div className="w-14 h-14 rounded-full border-2 border-[#D4AF37] flex items-center justify-center mb-1 shadow-[0_0_15px_rgba(212,175,55,0.2)] bg-[#0a0a0a]">
                <span className="font-serif text-3xl font-normal text-[#D4AF37] leading-none mt-1" style={{fontFamily:'serif'}}>M</span>
              </div>
              <span className="font-serif text-2xl tracking-[0.15em] text-[#D4AF37] font-semibold drop-shadow-sm" style={{fontFamily:'serif'}}>MOHY</span>
              <span className="font-sans text-[10px] tracking-[0.3em] text-[#D4AF37] mt-0.5 opacity-90 drop-shadow-sm">STUDIO</span>
            </div>
          );

          if (dbError) return <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-6 text-center"><AlertTriangle className="text-red-500 mb-4" size={64}/><h2 className="text-xl font-bold mb-2">{dbError}</h2></div>;
          if (dbLoading) return <div className="min-h-screen bg-gray-50 flex items-center justify-center"><Loader2 className="animate-spin text-[#D4AF37]" size={48}/></div>;

          if (!currentUser) {
            return (
              <div dir="rtl" className="min-h-screen bg-[#0a0a0a] flex flex-col items-center justify-center p-4 font-sans selection:bg-[#D4AF37]/30 relative overflow-hidden">
                <div className="absolute top-0 right-0 w-64 h-64 bg-blue-900 rounded-full blur-[100px] opacity-20 -mr-20 -mt-20"></div>
                <div className="absolute bottom-0 left-0 w-64 h-64 bg-[#D4AF37] rounded-full blur-[100px] opacity-10 -ml-20 -mb-20"></div>
                <div className="bg-white/10 backdrop-blur-xl w-full max-w-md rounded-3xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-500 z-10 border border-white/5">
                  <div className="p-8 text-center relative overflow-hidden border-b border-white/5">
                    <MohyLogo className="mb-6 scale-90" />
                    <h1 className="text-2xl font-black text-white relative z-10 tracking-tight">نظام إدارة الصاج</h1>
                    <p className="text-gray-400 mt-2 text-sm relative z-10">تسجيل الدخول للمتابعة</p>
                  </div>
                  <div className="p-8">
                    <form onSubmit={handleLogin} className="space-y-6">
                      {loginError && <div className="bg-red-500/20 text-red-400 p-4 rounded-xl text-sm border border-red-500/30 text-center font-bold">{loginError}</div>}
                      <div>
                        <label className="block text-gray-300 text-sm font-bold mb-2">اسم المستخدم</label>
                        <div className="relative group">
                          <User className="absolute right-4 top-3.5 text-gray-500 group-focus-within:text-[#D4AF37] transition-colors" size={20} />
                          <input type="text" required className="w-full pl-4 pr-12 py-3.5 bg-black/40 border border-gray-700 rounded-2xl focus:ring-2 focus:ring-[#D4AF37] text-white outline-none" value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} />
                        </div>
                      </div>
                      <div>
                        <label className="block text-gray-300 text-sm font-bold mb-2">كلمة المرور</label>
                        <div className="relative group">
                          <Lock className="absolute right-4 top-3.5 text-gray-500 group-focus-within:text-[#D4AF37] transition-colors" size={20} />
                          <input type="password" required className="w-full pl-4 pr-12 py-3.5 bg-black/40 border border-gray-700 rounded-2xl focus:ring-2 focus:ring-[#D4AF37] text-white outline-none" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} />
                        </div>
                      </div>
                      <button type="submit" className="w-full bg-gradient-to-r from-[#D4AF37] to-[#AA8000] hover:opacity-90 text-black font-black py-4 rounded-2xl shadow-[0_0_15px_rgba(212,175,55,0.4)] transition-all active:scale-95 flex items-center justify-center gap-2 mt-4">
                        <LogIn size={20} /> دخول للنظام
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            );
          }

          const renderDashboard = () => {
            if (!hasPerm('dashboard')) return <div className="p-8 text-center text-gray-500">عفواً، لا تملك صلاحية.</div>;
            const todaySales = sales.filter(s => s.timestamp && new Date(s.timestamp).toDateString() === new Date().toDateString()).reduce((a,b)=>a+(b.total||0),0);
            const todayExp = expenses.filter(e => e.timestamp && new Date(e.timestamp).toDateString() === new Date().toDateString()).reduce((a,b)=>a+(b.amount||0),0);
            const todayNet = todaySales - todayExp;
            return (
              <div className="p-4 space-y-4 animate-in fade-in zoom-in duration-300 print:hidden">
                <div className={`text-white rounded-2xl p-6 shadow-lg ${todayNet >= 0 ? 'bg-gradient-to-br from-green-500 to-green-700' : 'bg-gradient-to-br from-red-500 to-red-700'}`}>
                  <h2 className="text-lg opacity-90 mb-1 flex items-center gap-2"><Wallet size={20} /> صافي دخل (اليوم)</h2>
                  <p className="text-3xl font-black">{todayNet.toLocaleString()} ج.م</p>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
                    <Package className="text-blue-500 mb-2 mx-auto" size={28} />
                    <p className="text-gray-500 text-xs font-bold mb-1">قيمة البضاعة</p>
                    <p className="text-xl font-black text-gray-800">{inventoryValue.toLocaleString()}</p>
                  </div>
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
                    <Package className="text-[#D4AF37] mb-2 mx-auto" size={28} />
                    <p className="text-gray-500 text-xs font-bold mb-1">إجمالي الألواح</p>
                    <p className="text-xl font-black text-gray-800">{inventory.reduce((sum, item) => sum + (item.qty || 0), 0)}</p>
                  </div>
                </div>
                <button onClick={() => setActiveTab('reports')} className="w-full bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between mt-4 active:bg-gray-50">
                  <div className="flex items-center gap-3"><div className="bg-[#D4AF37]/10 p-2 rounded-lg text-[#D4AF37]"><CalendarDays size={20} /></div><span className="font-bold text-gray-800">الانتقال للتقارير</span></div>
                  <ChevronRight className="text-gray-400" size={20} />
                </button>
              </div>
            );
          };

          const renderInventory = () => {
            if (!hasPerm('inventory')) return <div className="p-8 text-center text-gray-500">عفواً، لا تملك صلاحية.</div>;
            return (
              <div className="p-4 space-y-6 animate-in fade-in zoom-in duration-300 print:hidden">
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                  <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-gray-800"><PlusCircle size={20} className="text-[#D4AF37]" /> إضافة صنف</h2>
                  <form onSubmit={handleAddItem} className="space-y-3">
                    <input type="text" required placeholder="اسم الصنف" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#D4AF37] outline-none" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})} />
                    <div className="flex gap-3">
                      <input type="number" step="0.1" placeholder="السمك (مم)" className="w-1/2 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#D4AF37] outline-none" value={newItem.thickness} onChange={e => setNewItem({...newItem, thickness: e.target.value})} />
                      <input type="text" placeholder="المقاس" className="w-1/2 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#D4AF37] outline-none" value={newItem.size} onChange={e => setNewItem({...newItem, size: e.target.value})} />
                    </div>
                    <div className="flex gap-3">
                      <input type="number" required placeholder="الكمية" className="w-1/2 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#D4AF37] outline-none" value={newItem.qty} onChange={e => setNewItem({...newItem, qty: e.target.value})} />
                      <input type="number" required placeholder="السعر" className="w-1/2 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#D4AF37] outline-none" value={newItem.price} onChange={e => setNewItem({...newItem, price: e.target.value})} />
                    </div>
                    <button type="submit" className="w-full bg-[#111] text-[#D4AF37] font-bold p-3 rounded-xl mt-2 active:scale-95 transition-transform">حفظ</button>
                  </form>
                </div>
                <div>
                  <h2 className="text-lg font-bold mb-4 text-gray-800">المخزون الحالي</h2>
                  <div className="space-y-3">
                    {inventory.length === 0 ? <div className="text-center p-8 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300">المخزن فارغ</div> : 
                    inventory.map(item => (
                      <div key={item.id} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                        <div>
                          <h3 className="font-bold text-gray-800 text-lg">{item.name}</h3>
                          <p className="text-sm text-gray-500 mt-1">{item.thickness} مم | {item.size}</p>
                          <p className="text-sm font-semibold text-blue-600 mt-1">{item.price} ج.م</p>
                        </div>
                        <div className="flex flex-col items-end gap-2">
                          <span className={`px-3 py-1 rounded-lg text-sm font-bold ${(item.qty||0) > 10 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{item.qty} لوح</span>
                          <button onClick={() => handleDeleteItem(item.id)} className="text-red-400 p-1 hover:text-red-600"><Trash2 size={18} /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            );
          };

          const renderPOS = () => {
            if (!hasPerm('pos')) return <div className="p-8 text-center text-gray-500">عفواً، لا تملك صلاحية.</div>;
            return (
              <div className="p-4 space-y-6 animate-in fade-in zoom-in duration-300 print:hidden">
                {posError && <div className="bg-red-100 border border-red-200 text-red-700 p-4 rounded-2xl flex items-center gap-3 font-bold"><AlertTriangle size={20} /> {posError}</div>}
                <div>
                  <h2 className="text-lg font-bold mb-3 text-gray-800">الأصناف</h2>
                  <div className="grid grid-cols-2 gap-3">
                    {inventory.filter(item => (item.qty || 0) > 0).map(item => (
                      <div key={item.id} onClick={() => handleAddToCart(item)} className="bg-white p-3 rounded-2xl border border-gray-200 shadow-sm active:border-[#D4AF37] active:bg-[#D4AF37]/10 cursor-pointer relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-1 h-full bg-[#111]"></div>
                        <h3 className="font-bold text-gray-800 text-sm">{item.name}</h3>
                        <p className="text-xs text-gray-500">{item.thickness}مم - {item.price} ج.م</p>
                        <p className="text-[10px] text-gray-400 mt-1">متاح: {item.qty}</p>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                  <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-gray-800"><FileText size={20} className="text-[#D4AF37]" /> الفاتورة</h2>
                  {cart.length === 0 ? <p className="text-center text-gray-400 py-4 text-sm">السلة فارغة</p> : (
                    <div className="space-y-4">
                      <div className="bg-gray-50 p-3 rounded-xl border border-gray-200 space-y-3">
                        <div className="relative"><User className="absolute right-3 top-3 text-gray-400" size={18} /><input type="text" placeholder="اسم العميل" className="w-full pl-3 pr-10 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#D4AF37] outline-none text-sm" value={customerName} onChange={e => setCustomerName(e.target.value)} /></div>
                        <div className="relative"><Phone className="absolute right-3 top-3 text-gray-400" size={18} /><input type="tel" placeholder="رقم الموبايل" className="w-full pl-3 pr-10 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#D4AF37] outline-none text-sm" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} /></div>
                      </div>
                      <div className="space-y-2">
                        {cart.map(c => (
                          <div key={c.item.id} className="flex justify-between items-center border-b border-gray-50 pb-2">
                            <div><h4 className="font-bold text-gray-800 text-sm">{c.item.name}</h4><p className="text-xs text-gray-500">{c.qty} × {c.item.price} ج.م</p></div>
                            <div className="flex items-center gap-3"><span className="font-black text-gray-800">{(c.qty || 0) * (c.item.price || 0)}</span><button onClick={() => handleRemoveFromCart(c.item.id)} className="text-red-400 p-1"><Trash2 size={16} /></button></div>
                          </div>
                        ))}
                      </div>
                      <div className="pt-2 flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <span className="font-bold text-gray-600">الإجمالي:</span><span className="text-xl font-black text-blue-600">{(cartTotal || 0).toLocaleString()} ج.م</span>
                      </div>
                      <button onClick={handleCheckout} className="w-full mt-2 bg-gradient-to-r from-green-500 to-green-600 text-white font-bold py-3.5 rounded-xl flex justify-center items-center gap-2 active:scale-95 transition-transform"><CheckCircle size={20} /> تأكيد البيع</button>
                    </div>
                  )}
                </div>
              </div>
            );
          };

          const renderExpenses = () => {
            if (!hasPerm('expenses')) return <div className="p-8 text-center text-gray-500">عفواً، لا تملك صلاحية.</div>;
            return (
              <div className="p-4 space-y-6 animate-in fade-in zoom-in duration-300 print:hidden">
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                  <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-red-600"><PlusCircle size={20} /> تسجيل منصرف</h2>
                  <form onSubmit={handleAddExpense} className="space-y-3">
                    <input type="text" required placeholder="البيان" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none" value={newExpense.desc} onChange={e => setNewExpense({...newExpense, desc: e.target.value})} />
                    <input type="number" required placeholder="المبلغ" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none" value={newExpense.amount} onChange={e => setNewExpense({...newExpense, amount: e.target.value})} />
                    <button type="submit" className="w-full bg-red-500 text-white font-bold p-3 rounded-xl mt-2 active:scale-95 transition-transform">تسجيل</button>
                  </form>
                </div>
                <div>
                  <h2 className="text-lg font-bold mb-4 text-gray-800">المصروفات</h2>
                  <div className="space-y-3">
                    {expenses.slice(0,10).map(expense => (
                      <div key={expense.id} className="bg-white p-4 rounded-2xl shadow-sm border border-r-4 border-r-red-500 flex justify-between items-center">
                        <div><h3 className="font-bold text-gray-800">{expense.desc}</h3><p className="text-xs text-gray-500 mt-1">{expense.date}</p></div>
                        <div className="flex items-center gap-4"><span className="font-black text-red-600">{expense.amount}</span><button onClick={() => handleDeleteExpense(expense.id)} className="text-gray-300 hover:text-red-500"><Trash2 size={18} /></button></div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            );
          };

          const renderReports = () => {
            if (!hasPerm('reports') && currentUser.role !== 'admin') return <div className="p-8 text-center text-gray-500">عفواً، لا تملك صلاحية.</div>;
            return (
              <div className="p-4 space-y-6 animate-in fade-in zoom-in duration-300 print:hidden">
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                  <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-[#111]"><CalendarDays size={20} className="text-[#D4AF37]"/> تصفية</h2>
                  <div className="flex bg-gray-100 p-1 rounded-xl mb-4">
                    <button onClick={() => setReportPeriod('day')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${reportPeriod === 'day' ? 'bg-[#111] shadow text-[#D4AF37]' : 'text-gray-500'}`}>يومي</button>
                    <button onClick={() => setReportPeriod('month')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${reportPeriod === 'month' ? 'bg-[#111] shadow text-[#D4AF37]' : 'text-gray-500'}`}>شهري</button>
                    <button onClick={() => setReportPeriod('year')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${reportPeriod === 'year' ? 'bg-[#111] shadow text-[#D4AF37]' : 'text-gray-500'}`}>سنوي</button>
                    <button onClick={() => setReportPeriod('all')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${reportPeriod === 'all' ? 'bg-[#111] shadow text-[#D4AF37]' : 'text-gray-500'}`}>الكل</button>
                  </div>
                  {reportPeriod !== 'all' && <input type={reportPeriod === 'day' ? 'date' : reportPeriod === 'month' ? 'month' : 'number'} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#D4AF37] outline-none text-center font-bold" value={reportPeriod === 'year' ? reportDate.substring(0,4) : reportPeriod === 'month' ? reportDate.substring(0,7) : reportDate.substring(0,10)} onChange={e => { let newVal = e.target.value; if (reportPeriod === 'year') newVal = `${newVal}-01-01`; if (reportPeriod === 'month') newVal = `${newVal}-01`; setReportDate(new Date(newVal).toISOString()); }} />}
                </div>
                <div className={`text-white rounded-2xl p-6 shadow-lg ${netIncome >= 0 ? 'bg-gradient-to-br from-green-500 to-green-700' : 'bg-gradient-to-br from-red-500 to-red-700'}`}>
                  <h2 className="text-lg opacity-90 mb-1">الصافي</h2><p className="text-3xl font-black">{netIncome.toLocaleString()} ج.م</p>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center"><p className="text-gray-500 text-xs font-bold mb-1">المبيعات</p><p className="text-xl font-black text-blue-600">{totalSales.toLocaleString()}</p></div>
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center"><p className="text-gray-500 text-xs font-bold mb-1">المصروفات</p><p className="text-xl font-black text-red-600">{totalExpenses.toLocaleString()}</p></div>
                </div>
              </div>
            );
          };

          const renderUsers = () => {
            if (currentUser.role !== 'admin') return <div className="p-8 text-center text-gray-500">عفواً، هذه الصفحة للمدير فقط.</div>;
            return (
              <div className="p-4 space-y-6 animate-in fade-in zoom-in duration-300 print:hidden">
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                  <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-[#111]"><PlusCircle size={20} className="text-[#D4AF37]"/> إضافة مستخدم</h2>
                  <form onSubmit={handleAddUser} className="space-y-4">
                    <input type="text" required placeholder="اسم المستخدم" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#D4AF37] outline-none" value={newUser.username} onChange={e => setNewUser({...newUser, username: e.target.value})} />
                    <input type="text" required placeholder="كلمة المرور" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#D4AF37] outline-none" value={newUser.password} onChange={e => setNewUser({...newUser, password: e.target.value})} />
                    <button type="submit" className="w-full bg-[#111] text-[#D4AF37] font-bold p-3 rounded-xl mt-2 active:scale-95 transition-transform">حفظ</button>
                  </form>
                </div>
              </div>
            );
          };

          return (
            <div dir="rtl" className="min-h-screen bg-gray-50 font-sans text-right flex flex-col relative">
              {lastInvoice && (
                <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm print:bg-white print:p-0 print:block">
                  <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in zoom-in duration-300 print:shadow-none print:max-w-full print:rounded-none relative">
                    <button onClick={() => setLastInvoice(null)} className="absolute top-4 right-4 bg-gray-100 p-2 rounded-full text-gray-600 hover:bg-red-100 hover:text-red-600 transition-colors print:hidden"><X size={20} /></button>
                    <div id="printable-invoice" className="p-6 pt-10 bg-white text-black">
                      <div className="text-center mb-6 border-b-2 border-black pb-4"><h1 className="text-2xl font-black mb-1">فاتورة مبيعات</h1><p className="text-sm font-bold text-gray-600">رقم: {lastInvoice.invoiceNumber}</p></div>
                      <div className="flex justify-between text-sm mb-6 font-bold">
                        <div><p>التاريخ: {lastInvoice.date}</p><p>الوقت: {lastInvoice.time}</p></div>
                        <div className="text-left"><p>العميل: {lastInvoice.customerName}</p><p>البائع: {lastInvoice.seller}</p></div>
                      </div>
                      <table className="w-full text-sm mb-6">
                        <thead><tr className="border-y-2 border-black"><th className="py-2 text-right">الصنف</th><th className="py-2 text-center">الكمية</th><th className="py-2 text-center">السعر</th><th className="py-2 text-left">الإجمالي</th></tr></thead>
                        <tbody>{(lastInvoice.items || []).map((item, idx) => (<tr key={idx} className="border-b border-gray-300"><td className="py-2 font-bold">{item.name}</td><td className="py-2 text-center">{item.qty}</td><td className="py-2 text-center">{item.price}</td><td className="py-2 text-left font-bold">{item.total}</td></tr>))}</tbody>
                      </table>
                      <div className="flex justify-between items-center text-xl font-black bg-gray-100 p-3 print:bg-transparent print:border-t-2 print:border-black"><span>الإجمالي الكلي:</span><span>{(lastInvoice.total || 0).toLocaleString()} ج.م</span></div>
                      <div className="text-center mt-8 text-xs font-bold text-gray-500 print:block hidden"><p>البضاعة المباعة لا ترد ولا تستبدل إلا بالفاتورة</p><p>شكراً لتعاملكم معنا</p></div>
                    </div>
                    <div className="p-4 bg-gray-50 border-t border-gray-200 grid grid-cols-2 gap-3 print:hidden">
                      <button onClick={() => window.print()} className="flex flex-col items-center justify-center gap-2 bg-white border-2 border-gray-200 text-gray-700 py-3 rounded-xl font-bold active:bg-gray-100"><Printer size={24} /> طباعة</button>
                      <button onClick={sendWhatsApp} className="flex flex-col items-center justify-center gap-2 bg-green-500 text-white py-3 rounded-xl font-bold active:bg-green-600 shadow-md shadow-green-500/30"><MessageCircle size={24} /> واتساب</button>
                    </div>
                  </div>
                </div>
              )}

              <div className={`flex flex-col min-h-screen ${lastInvoice ? 'print:hidden overflow-hidden max-h-screen' : ''}`}>
                <header className="bg-[#111] text-white shadow-md px-4 py-3 sticky top-0 z-20 flex justify-between items-center border-b border-[#D4AF37]/30 print:hidden">
                  <div className="flex items-center gap-3"><div className="w-10 h-10 bg-[#D4AF37]/20 rounded-xl flex items-center justify-center font-black text-[#D4AF37] border border-[#D4AF37]/50">ص</div><div><h1 className="text-lg font-black tracking-tight">إدارة الصاج</h1><p className="text-[10px] text-gray-400 font-bold flex items-center gap-1 mt-0.5"><User size={10} className="text-[#D4AF37]"/> {currentUser.username}</p></div></div>
                  <div className="flex items-center gap-2">
                    {currentUser.role === 'admin' && <button onClick={() => setActiveTab('users')} className={`p-2 rounded-lg text-white transition-colors ${activeTab === 'users' ? 'bg-white/20 text-[#D4AF37]' : 'hover:bg-white/10'}`}><Settings size={20} className={activeTab === 'users' ? 'rotate-90 transition-transform' : ''} /></button>}
                    <button onClick={handleLogout} className="bg-white/10 p-2 rounded-lg text-red-400 hover:bg-red-500 hover:text-white transition-colors"><LogIn size={20} className="rotate-180" /></button>
                  </div>
                </header>

                <main className="flex-grow pb-24 relative flex flex-col print:hidden">
                  <div className="flex-grow min-h-[calc(100vh-220px)]">
                    {activeTab === 'dashboard' && renderDashboard()}
                    {activeTab === 'inventory' && renderInventory()}
                    {activeTab === 'pos' && renderPOS()}
                    {activeTab === 'expenses' && renderExpenses()}
                    {activeTab === 'reports' && renderReports()}
                    {activeTab === 'users' && renderUsers()}
                  </div>
                  <div className="py-8 mt-auto opacity-[0.15]"><MohyLogo /></div>
                </main>

                <nav className="fixed bottom-0 w-full bg-white border-t border-gray-200 pb-safe z-20 print:hidden">
                  <div className="flex justify-around items-center h-16 px-1">
                    {hasPerm('dashboard') && <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center justify-center w-full h-full gap-1 ${activeTab === 'dashboard' ? 'text-[#D4AF37]' : 'text-gray-400'}`}><LayoutDashboard size={22} className={activeTab === 'dashboard' ? 'scale-110 transition-transform' : ''} /><span className="text-[9px] font-bold">الرئيسية</span></button>}
                    {hasPerm('inventory') && <button onClick={() => setActiveTab('inventory')} className={`flex flex-col items-center justify-center w-full h-full gap-1 ${activeTab === 'inventory' ? 'text-[#D4AF37]' : 'text-gray-400'}`}><Package size={22} className={activeTab === 'inventory' ? 'scale-110 transition-transform' : ''} /><span className="text-[9px] font-bold">المخزن</span></button>}
                    {hasPerm('pos') && <button onClick={() => setActiveTab('pos')} className={`flex flex-col items-center justify-center w-full h-full gap-1 ${activeTab === 'pos' ? 'text-[#D4AF37]' : 'text-gray-400'}`}><div className="relative"><ShoppingCart size={22} className={activeTab === 'pos' ? 'scale-110 transition-transform' : ''} />{cart.length > 0 && <span className="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{cart.length}</span>}</div><span className="text-[9px] font-bold">المبيعات</span></button>}
                    {hasPerm('expenses') && <button onClick={() => setActiveTab('expenses')} className={`flex flex-col items-center justify-center w-full h-full gap-1 ${activeTab === 'expenses' ? 'text-[#D4AF37]' : 'text-gray-400'}`}><Wallet size={22} className={activeTab === 'expenses' ? 'scale-110 transition-transform' : ''} /><span className="text-[9px] font-bold">المصروفات</span></button>}
                    {hasPerm('reports') && <button onClick={() => setActiveTab('reports')} className={`flex flex-col items-center justify-center w-full h-full gap-1 ${activeTab === 'reports' ? 'text-[#D4AF37]' : 'text-gray-400'}`}><CalendarDays size={22} className={activeTab === 'reports' ? 'scale-110 transition-transform' : ''} /><span className="text-[9px] font-bold">التقارير</span></button>}
                  </div>
                </nav>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
